<style>

<script>
const $=s=>document.querySelector(s),esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={mode:'start',st:0,card:0,qi:0,xp:0,tr:{},ord:{},pi:0,pa:[],name:'',cls:'',t0:0,t1:0,tp:0};
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- рисование графов ---------- */
function G(N,E,o={}){const w=o.w||320,h=o.h||190,r=o.r||17,hl=o.hl||[],ck=o.click;
let s=`<svg viewBox="0 0 ${w} ${h}" class="g">`;
if(o.dir)s+=`<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0L9,3L0,6z" fill="#475569"/></marker><marker id="arh" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0L9,3L0,6z" fill="#f59e0b"/></marker></defs>`;
for(const [a,b] of E){const [x1,y1]=N[a],[x2,y2]=N[b],l=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/l,uy=(y2-y1)/l,on=hl.includes(a+b)||hl.includes(b+a);
let ex=x2,ey=y2;if(o.dir){ex-=ux*(r+3);ey-=uy*(r+3)}
s+=`<line x1="${x1}" y1="${y1}" x2="${ex}" y2="${ey}" stroke="${on?'#f59e0b':'#475569'}" stroke-width="${on?5:3}" stroke-linecap="round" ${o.dir?`marker-end="url(#ar${on?'h':''})"`:''}/>`}
for(const k in N){const [x,y,lb]=N[k],sel=(o.sel||[]).includes(k);
s+=`<g ${ck?`class="n" onclick="${ck}('${k}')"`:''}><circle cx="${x}" cy="${y}" r="${r}" fill="${sel?'#fde68a':'#e0e7ff'}" stroke="${sel?'#f59e0b':'#4f46e5'}" stroke-width="3"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="${r>14?16:12}" font-weight="700" fill="#312e81">${lb??k}</text>`;
if(o.bd&&o.bd[k]!=null)s+=`<circle cx="${x+r}" cy="${y-r}" r="11" fill="#ef4444"/><text x="${x+r}" y="${y-r+4}" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">${o.bd[k]}</text>`;
s+=`</g>`}
return s+'</svg>'}

/* Кёнигсберг: карта */
const KB=()=>{const br=(x,y,w,h,n)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#92400e"/><circle cx="${x+w/2}" cy="${y+h/2}" r="9" fill="#fff" stroke="#92400e"/><text x="${x+w/2}" y="${y+h/2+4}" text-anchor="middle" font-size="12" font-weight="700">${n}</text>`;
return `<svg viewBox="0 0 360 230" class="g"><rect width="360" height="230" rx="10" fill="#bbf7d0"/><rect y="80" width="360" height="62" fill="#7dd3fc"/><ellipse cx="120" cy="111" rx="55" ry="24" fill="#bbf7d0"/><ellipse cx="290" cy="111" rx="40" ry="24" fill="#bbf7d0"/>
${br(92,78,10,14,1)}${br(140,78,10,14,2)}${br(92,130,10,14,3)}${br(140,130,10,14,4)}${br(285,78,10,12,5)}${br(285,132,10,12,6)}${br(175,106,75,10,7)}
<g font-size="20" font-weight="700" fill="#14532d"><text x="170" y="45">A</text><text x="170" y="205">C</text><text x="113" y="118">B</text><text x="283" y="118">D</text></g><text x="20" y="116" font-size="13" fill="#0c4a6e" font-style="italic">р. Прегель</text><text x="10" y="22" font-size="13" fill="#14532d">🏰 Кёнигсберг, 1736</text></svg>`};
/* Кёнигсберг: граф с кликабельными рёбрами */
const KGN={A:[180,30],B:[60,110],D:[300,110],C:[180,190]};
const KGE=[['A','B',-1],['A','B',1],['C','B',-1],['C','B',1],['A','D',0],['C','D',0],['B','D',0]];
function KG(){let s=`<svg viewBox="0 0 360 220" class="g" id="kg">`;
for(const [a,b,f] of KGE){const [x1,y1]=KGN[a],[x2,y2]=KGN[b],l=Math.hypot(x2-x1,y2-y1),px=-(y2-y1)/l*f*44,py=(x2-x1)/l*f*44;
s+=`<path class="e" d="M${x1},${y1} Q${(x1+x2)/2+px},${(y1+y2)/2+py} ${x2},${y2}" onclick="kb(this)"/>`}
for(const k in KGN){const [x,y]=KGN[k];s+=`<circle cx="${x}" cy="${y}" r="19" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/><text x="${x}" y="${y+6}" text-anchor="middle" font-size="18" font-weight="700" fill="#312e81">${k}</text>`}
return s+'</svg><div class="msg" id="kc">Пройдено мостов: 0 из 7</div><button class="s" onclick="kbR()">↺ Начать заново</button>'}
function kb(e){e.classList.toggle('on');const n=document.querySelectorAll('#kg .on').length;$('#kc').textContent='Пройдено мостов: '+n+' из 7'+(n==7?' — получилось?! А вернуться в начало и не повторить мост?':'')}
function kbR(){document.querySelectorAll('#kg .on').forEach(e=>e.classList.remove('on'));$('#kc').textContent='Пройдено мостов: 0 из 7'}

/* ---------- интерактивы уровней 5, 6 ---------- */
const PN={1:[40,50],2:[150,25],3:[270,60],4:[80,150],5:[230,150]},PE=[['1','2'],['2','3'],['1','4'],['2','4'],['3','5'],['4','5']];
let PB=[];
function pbR(){const hl=[];for(let i=1;i<PB.length;i++)hl.push(PB[i-1]+PB[i]);
let m=PB.length?`Путь: ${PB.join(' → ')}. Длина пути = ${PB.length-1}`:'Нажимай на вершины по очереди, начиная с любой';
if(PB.length>3&&PB[0]==PB[PB.length-1])m+=' 🔁 Это ЦИКЛ — путь вернулся в начало!';
$('#pb').innerHTML=G(PN,PE,{hl,click:'pb',sel:PB.length?[PB[PB.length-1]]:[]});$('#pm').textContent=m}
function pb(k){const l=PB[PB.length-1];if(!l||PE.some(e=>e.join('')==l+k||e.join('')==k+l))PB.push(k);else{$('#pm').textContent='❌ Между '+l+' и '+k+' нет ребра — путь не получится';return}pbR()}
const DN={1:[50,60],2:[170,30],3:[170,130],4:[290,60],5:[290,150]},DE=[['1','2'],['1','3'],['2','3'],['2','4'],['3','4'],['4','5']];
let DD={};
function drR(l){const bd={};for(const k in DD)bd[k]=DD[k];const hl=l?DE.filter(e=>e.includes(l)).map(e=>e.join('')):[];
$('#dg').innerHTML=G(DN,DE,{bd,click:'dr',hl,w:340,h:190});const ks=Object.keys(DD),sum=ks.reduce((a,k)=>a+DD[k],0);
$('#dm').innerHTML=`Открыто вершин: ${ks.length} из 5. Сумма степеней = <b>${ks.map(k=>DD[k]).join(' + ')||'0'} = ${sum}</b>`+(ks.length==5?`<br>Рёбер в графе: 6, и 2·6 = ${sum}. Каждое ребро учтено дважды — потому сумма всегда чётна! 🎉`:'')}
function dr(k){DD[k]=DE.filter(e=>e.includes(k)).length;drR(k)}

/* ---------- содержание уровней ---------- */
const web=()=>`<div style="display:flex;align-items:center;justify-content:center;gap:14px"><span style="font-size:90px">🕸️</span><span style="font-size:36px">➜</span><div style="width:230px">${G({A:[30,40],B:[110,20],C:[190,50],D:[70,100],E:[160,105]},[['A','B'],['B','C'],['A','D'],['B','D'],['C','E'],['D','E']],{w:220,h:130,r:14})}</div></div>`;
const VG=()=>G({A:[50,50],B:[160,30],C:[270,70],D:[130,150]},[['A','B'],['B','C'],['C','D'],['B','D']],{click:'',w:320,h:190})+`<div class="pill">V = {A, B, C, D}<br>E = {(A,B), (B,C), (C,D), (B,D)}</div>`;
const mini=(t,n,e,o)=>`<div>${G(n,e,Object.assign({w:150,h:110,r:14},o))}<b>${t}</b></div>`;
const ST=[
{t:'Паутина связей',ic:'🕸️',badge:'🕷️ Паук-связист',c:[
 {h:'Что такое граф?',p:'<p>Представь паутину: каждая <b>точка</b> — отдельный объект, а <b>нить</b> между точками — связь. В математике и информатике такая модель называется <b>графом</b>.</p><p>Теория графов — универсальный язык для описания любых сетей. Важно не столько <i>что</i> за объекты, сколько <i>как они связаны</i>.</p>',v:web},
 {h:'Формальное определение',p:'<p><b>Граф G = (V, E)</b> — пара множеств:</p><p>• <b>V</b> (Vertices) — непустое множество <b>вершин</b> (узлов);<br>• <b>E</b> (Edges) — множество пар вершин, то есть <b>рёбер</b>.</p>',v:VG}],
 q:[{q:'В записи G = (V, E) буква E обозначает…',o:['множество рёбер (связей)','множество вершин','степень вершины','длину пути'],w:'E — Edges, рёбра: пары вершин, которые соединены.'},
    {q:'Карта дорог региона — это граф. Что в нём играет роль вершин?',o:['города и перекрёстки','дороги','расстояния в км','водители'],w:'Вершины — объекты (города, перекрёстки), рёбра — дороги между ними.'}]},
{t:'Тайна Кёнигсберга',ic:'🌉',badge:'🌉 Эйлеров мост',c:[
 {h:'Задача о семи мостах',p:'<p>XVIII век, прусский город <b>Кёнигсберг</b> (ныне Калининград). Через город течёт река Прегель с двумя островами. Острова и берега соединены <b>семью мостами</b>.</p><div class="pill">Горожан веками мучил вопрос: можно ли пройти по всем мостам <b>ровно по одному разу</b> и вернуться в исходную точку?</div>',v:KB},
 {h:'Попробуй сам!',p:'<p>В 1736 году задачу решил <b>Леонард Эйлер</b>. Он отбросил всё лишнее — размеры мостов, здания, ширину рек — и нарисовал <b>точки и линии</b>: четыре части суши (A, B, C, D) стали вершинами, семь мостов — рёбрами.</p><p>Кликай по рёбрам — отмечай пройденные мосты:</p>',v:KG},
 {h:'Вывод Эйлера',p:'<p>Эйлер математически <b>доказал: такой маршрут невозможен</b>. Этот «геометрический фокус» положил начало новому разделу математики — <b>теории графов</b>, которая долго считалась «чистой теорией», далёкой от практики.</p><div class="big">🧑‍🏫 ➜ 📐</div>',v:()=>''}],
 q:[{q:'Кто и когда решил задачу о кёнигсбергских мостах?',o:['Леонард Эйлер, 1736 год','Исаак Ньютон, 1687 год','Алан Тьюринг, 1936 год','Блез Паскаль, 1642 год'],w:'Эйлер в 1736 году доказал, что нужный маршрут невозможен.'},
    {q:'Что сделал Эйлер, чтобы решить задачу?',o:['Отбросил лишнее и представил город точками и линиями','Измерил длину всех мостов','Построил восьмой мост','Обошёл все мосты пешком'],w:'Модель = только суть: вершины (суша) и рёбра (мосты).'}]},
{t:'Графы вокруг нас',ic:'🌍',badge:'🌍 Сетевой навигатор',c:[
 {h:'Зачем это нужно сегодня?',p:'<p>В XXI веке теория графов — важнейший инструмент инженера, программиста и специалиста по ИИ.</p>',v:()=>`<div class="row">${mini('🗺️ Навигация',{a:[20,80,'🏠'],b:[75,25,'📍'],c:[130,80,'🏫'],d:[75,90,'⛽']},[['a','b'],['b','c'],['a','d'],['d','c']])}${mini('👥 Соцсети',{a:[75,20,'👤'],b:[25,60,'👤'],c:[125,60,'👤'],d:[75,95,'👤']},[['a','b'],['a','c'],['b','d'],['c','d'],['a','d']])}${mini('🌐 Интернет',{a:[20,55,'💻'],b:[75,55,'📡'],c:[130,25,'🖥️'],d:[130,90,'📱']},[['a','b'],['b','c'],['b','d']])}</div><div class="pill" style="text-align:left">🗺️ <b>Яндекс.Карты, Google Maps</b> за миллисекунды находят кратчайший путь и объезжают пробки.<br>👥 <b>Соцсети</b>: «Вы можете быть знакомы» и таргетинг строятся на анализе связей.<br>🌐 <b>Интернет</b>: маршрутизация пакетов данных оптимизируется графовыми моделями.</div>`},
 {h:'Графы и нейросети',p:'<p>Архитектура глубоких нейронных сетей, которую мы изучали в первой четверти (входной, скрытый и выходной слои, связи между нейронами), опирается на <b>взвешенные ориентированные графы</b>.</p>',v:()=>{const N={i1:[20,35,''],i2:[20,95,''],h1:[100,15,''],h2:[100,65,''],h3:[100,115,''],o1:[180,40,''],o2:[180,90,'']},E=[];['i1','i2'].forEach(a=>['h1','h2','h3'].forEach(b=>E.push([a,b])));['h1','h2','h3'].forEach(a=>['o1','o2'].forEach(b=>E.push([a,b])));return G(N,E,{dir:1,w:200,h:130,r:9})+'<div style="font-size:14px">вход ➜ скрытый слой ➜ выход</div>'}},
 {h:'Графы в повседневной жизни',p:'<p>Заказ доставки еды, маршрут общественного транспорта, <b>граф знаний</b> поисковых систем, компиляция сложного кода — везде «под капотом» работают графовые структуры. Понимание этих алгоритмов — ключ к задачам оптимизации в любой технологической сфере.</p><div class="big">🍕🚌🔎💻</div>',v:()=>''}],
 q:[{q:'В графе социальной сети вершины и рёбра — это…',o:['пользователи и связи (дружба) между ними','посты и лайки','серверы и провода','сообщения и время'],w:'Вершины — профили людей, рёбра — дружба/подписка.'},
    {q:'Какая структура лежит в основе нейронной сети?',o:['Взвешенный ориентированный граф','Неориентированный граф без весов','Таблица умножения','Дерево каталогов'],w:'Нейроны — вершины, связи с весами — направленные дуги.'}]},
{t:'Вершина, ребро, дуга',ic:'🔵',badge:'🔵 Мастер связей',c:[
 {h:'Вершина и ребро',p:'<p><b>Вершина</b> — базовый объект графа (населённый пункт, сервер, веб-страница). На схемах — точка или кружок с меткой: A, B, C или 0, 1, 2.</p><p><b>Ребро</b> — связь между двумя вершинами в <i>неориентированном</i> графе, обозначается парой (u, v). Связь <b>двусторонняя</b>: если A соединена с B, то и B соединена с A.</p>',v:()=>G({A:[60,70],B:[240,70]},[['A','B']],{w:300,h:140})+'<div>Ребро (A, B) = ребро (B, A) 🚗↔🚗</div>'},
 {h:'Дуга',p:'<p><b>Дуга</b> — направленное ребро в <i>ориентированном</i> графе (орграфе). Направление строго «откуда ➜ куда».</p><div class="pill">Дуга A ➜ B <b>не означает</b> автоматического пути из B в A. Пример: улица с односторонним движением.</div>',v:()=>G({A:[60,70],B:[240,70]},[['A','B']],{w:300,h:140,dir:1})+'<div>Дуга A ➜ B 🚗➜</div>'},

const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};

class SrvErr extends Error{}
async function driveSend(data){
  const url=driveUrl();if(!url)throw new Error('no-url');
  try{
    const r=await fetch(url,{method:'POST',body:JSON.stringify(data)});
    const j=await r.json();
    if(j&&j.ok)return;
    throw new SrvErr((j&&j.error)||'server');
  }catch(e){
    if(e instanceof SrvErr||(e&&e.name==='SyntaxError'))throw e;
    /* браузер не дал прочитать ответ — отправляем «вслепую»; повтор безопасен: сервер отсеивает дубли по id */
    await fetch(url,{method:'POST',mode:'no-cors',body:JSON.stringify(data)});
  }
}
async function flushPending(){
  if(!driveUrl())return;
  const q=getQ();if(!q.length)return;
  const rest=[];
  for(const d of q){try{await driveSend(d)}catch(e){rest.push(d)}}
  setQ(rest);
}
function whyFail(e){
  if(e&&e.name==='SyntaxError')return 'Google ответил обычной страницей, а не ответом скрипта. Чаще всего это значит, что у развёртывания доступ не «Все» или скрипт не получил разрешений.';
  if(e instanceof SrvErr)return 'скрипт вернул ошибку: '+e.message;
  return 'нет связи с script.google.com (интернет, школьный фильтр или блокировщик рекламы). '+((e&&e.message)||'');
}
function driveBlock(d){
  const box=$('#sv');if(!box)return;
  const set=(cls,html)=>{box.className='sv '+cls;box.innerHTML=html};
  const dl='<button class="s" id="svDl" type="button">Скачать файл</button>';
  const bindDl=()=>{const b=box.querySelector('#svDl');if(b)b.onclick=save};
  async function send(){
    if(!driveUrl()){set('warn','<span>Google Диск не подключён — результат никуда не отправлен.</span>'+dl);bindDl();return}
    set('wait','<span>Сохраняю результат на Google Диск…</span>');
    try{
      await driveSend(d);
      setQ(getQ().filter(x=>x.id!==d.id));
      set('ok','<span>✓ Результат сохранён на Google Диске.</span>');
    }catch(e){
      const q=getQ();if(!q.some(x=>x.id===d.id)){q.push(d);setQ(q)}
      set('bad','<span>Не получилось сохранить.<br><small style="font-weight:400">Причина: '+esc(whyFail(e))+'</small></span><button id="svRetry" type="button">Повторить</button>'+dl);
      box.querySelector('#svRetry').onclick=send;bindDl();
    }
  }
  send();
}

  if(v===null)return;
  const u=v.trim();
  if(u&&!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)){alert('Адрес должен начинаться с https://script.google.com/ и заканчиваться на /exec');return}
  lsSet(LS_URL,u);
  if(!u){alert('Адрес убран.');start();return}
